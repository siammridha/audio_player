[package]
name = "audio-player"
version = "0.1.0"
edition = "2024"

[dependencies]
alsa = "0.12"
anyhow = "1.0.104"
rodio = { version = "0.22.2", default-features = false, features = ["mp3", "wav", "flac", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"

[dev-dependencies]
tempfile = "3.27.0"
