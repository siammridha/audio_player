<meta name="theme-color" content="#160f08" />

<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  :root {
    --bg1: #1a1108;
    --bg2: #0e0e0e;
    --text: #f5efe6;
    --muted: #a08f78;
    --line: rgba(255, 255, 255, 0.08);
    --track: rgba(255, 255, 255, 0.1);
    --orange: #ff8c1a;
    --orange-dim: #7a4a12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg1), var(--bg2) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  main { width: 100%; max-width: 26rem; }
  h1 {
    text-align: center;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1.75rem;
  }
  svg { flex-shrink: 0; display: block; }

  .art {
    width: 11rem;
    height: 11rem;
    margin: 0 auto 1.5rem;
    border-radius: 20px;
    background: radial-gradient(circle at 30% 30%, #ffb35c, var(--orange) 45%, var(--orange-dim) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(255, 140, 26, 0.25);
  }
  .art svg { width: 13rem; height: 13rem; color: rgba(0, 0, 0, 0.45); }

  #now-playing { text-align: center; font-size: 1.15rem; font-weight: 600; margin: 0 0 0.25rem; }
  #now-playing-caption { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 0 0 1.5rem; }
  #output-device { text-align: center; color: var(--muted); font-size: 0.75rem; margin: -1.25rem 0 1.5rem; }

  #progress { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 1.75rem; }
  #progress-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  #progress-fill { height: 100%; width: 0%; background: var(--orange); border-radius: 2px; }
  #time { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 1.5rem; margin-bottom: 1.75rem; }
  .controls button {
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .controls button:active:not(:disabled) { transform: scale(0.93); }
  .controls button:disabled { opacity: 0.35; cursor: default; }
  .controls button span { display: none; }
  #restart svg, #loop svg { width: 22px; height: 22px; color: var(--muted); }
  #loop.on svg { color: var(--orange); }
  #play-pause {
    width: 4.2rem;
    height: 4.2rem;
    border-radius: 50%;
    background: var(--orange);
    color: #241400;
  }
  #play-pause svg { width: 28px; height: 28px; }
  #play-pause:disabled { background: var(--orange-dim); color: #1a1a1a; }

  #volume { display: flex; align-items: center; gap: 0.75rem; margin: 0 0 1.75rem; color: var(--muted); }
  #volume svg { width: 16px; height: 16px; }
  #volume-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--track);
    outline: none;
  }
  #volume-slider::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(
      to right,
      var(--orange) var(--volume-pct, 100%),
      var(--track) var(--volume-pct, 100%)
    );
  }
  #volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--orange);
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  #volume-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
  #volume-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--orange); }
  #volume-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--orange);
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  #volume-slider:hover::-webkit-slider-thumb,
  #volume-slider:active::-webkit-slider-thumb { transform: scale(1.15); }
  #volume-slider:hover::-moz-range-thumb,
  #volume-slider:active::-moz-range-thumb { transform: scale(1.15); }

  ul#files { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  #files li { border-bottom: 1px solid var(--line); }
  #files button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-align: left;
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 0.7rem 0.1rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #files button svg { display: none; }
  #files button.active { color: var(--orange); font-weight: 600; }
  #files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files .dur { margin-left: auto; font-size: 0.72rem; font-variant-numeric: tabular-nums; }
  #empty { color: var(--muted); font-size: 0.85rem; padding: 0.7rem 0.1rem; }
</style>

  </div>

  <p id="now-playing">Nothing selected</p>
  <p id="now-playing-caption">Now Playing</p>

  <div id="progress">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <span id="time">0:00</span>
  </div>

  <div class="controls">
    <button id="loop" disabled></button>
    <button id="play-pause" disabled></button>
    <button id="restart" disabled></button>
  </div>

  <div id="volume">
    <span id="volume-icon"></span>
    <input type="range" id="volume-slider" min="0" max="100" value="100" />
  </div>

  <ul id="files"></ul>
</main>

<script>
  const ICONS = {
    play: '<svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M7 5v14l12-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
    restart: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
    loop: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
    note: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    volume: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  };

  const OUTPUT_LABELS = {
    usb: "Playing through USB sound card",
    "built-in": "Playing through built-in speaker",
    mock: "Mock output",
  };

  const filesEl = document.getElementById("files");
  const outputDeviceEl = document.getElementById("output-device");
  const nowPlayingEl = document.getElementById("now-playing");
  const nowPlayingCaptionEl = document.getElementById("now-playing-caption");
  const progressEl = document.getElementById("progress");
  const progressFillEl = document.getElementById("progress-fill");
  const timeEl = document.getElementById("time");
  const playPauseEl = document.getElementById("play-pause");
  const restartEl = document.getElementById("restart");
  const loopEl = document.getElementById("loop");
  const volumeIconEl = document.getElementById("volume-icon");
  const volumeSliderEl = document.getElementById("volume-slider");

  restartEl.innerHTML = ICONS.restart + "<span>Start Over</span>";
  loopEl.innerHTML = ICONS.loop + "<span>Loop</span>";
  volumeIconEl.innerHTML = ICONS.volume;

  let files = [];

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function formatTime(seconds) {
    if (seconds == null || !isFinite(seconds) || seconds < 0) return "0:00";
    const total = Math.floor(seconds);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const ss = String(s).padStart(2, "0");
    return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
  }

  async function api(path, options) {
    const res = await fetch(path, options);
    return res.json();
  }

  function renderFiles(status) {
    filesEl.innerHTML = "";
    if (files.length === 0) {
      const li = document.createElement("li");
      li.id = "empty";
      li.textContent = "No audio files found.";
      filesEl.appendChild(li);
      return;
    }
    for (const f of files) {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.dataset.name = f.name;
      button.innerHTML =
        ICONS.note +
        `<span class="name">${escapeHtml(f.name)}</span>` +
        (f.duration != null ? `<span class="dur">${formatTime(f.duration)}</span>` : "");
      if (f.name === status.file) button.classList.add("active");
      button.addEventListener("click", () => play(f.name));
      li.appendChild(button);
      filesEl.appendChild(li);
    }
  }

  function renderStatus(status) {
    outputDeviceEl.textContent = OUTPUT_LABELS[status.output] || "";

    if (status.file) {
      nowPlayingEl.textContent = status.file;
      nowPlayingCaptionEl.style.display = "";
    } else {
      nowPlayingEl.textContent = "Nothing selected";
      nowPlayingCaptionEl.style.display = "none";
    }

    if (status.file) {
      timeEl.textContent =
        status.duration != null
          ? `${formatTime(status.position)} / ${formatTime(status.duration)}`
          : formatTime(status.position);
      const pct = status.duration ? Math.min(100, (status.position / status.duration) * 100) : 0;
      progressFillEl.style.width = `${pct}%`;
    } else {
      timeEl.textContent = "0:00";
      progressFillEl.style.width = "0%";
    }

    playPauseEl.disabled = !status.file;
    restartEl.disabled = !status.file;
    loopEl.disabled = false;

    playPauseEl.innerHTML =
      (status.playing ? ICONS.pause : ICONS.play) +
      `<span>${status.playing ? "Pause" : "Play"}</span>`;
    loopEl.classList.toggle("on", status.loop);

    if (document.activeElement !== volumeSliderEl) {
      volumeSliderEl.value = Math.round(status.volume * 100);
    }
    volumeSliderEl.style.setProperty("--volume-pct", `${volumeSliderEl.value}%`);

    for (const button of filesEl.querySelectorAll("button")) {
      button.classList.toggle("active", button.dataset.name === status.file);
    }
  }

  async function refreshStatus() {
    const status = await api("/api/status");
    renderStatus(status);
    return status;
  }

  async function play(name) {
    const status = await api("/api/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file: name }),
    });
    renderStatus(status);
  }

  playPauseEl.addEventListener("click", async () => {
    renderStatus(await api("/api/toggle", { method: "POST" }));
  });

  restartEl.addEventListener("click", async () => {
    renderStatus(await api("/api/restart", { method: "POST" }));
  });

  loopEl.addEventListener("click", async () => {
    const wantsLoop = !loopEl.classList.contains("on");
    renderStatus(
      await api("/api/loop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ loop: wantsLoop }),
      })
    );
  });

  volumeSliderEl.addEventListener("input", () => {
    volumeSliderEl.style.setProperty("--volume-pct", `${volumeSliderEl.value}%`);
    api("/api/volume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ volume: Number(volumeSliderEl.value) / 100 }),
    });
  });

  (async function init() {
    files = await api("/api/files");
    const status = await refreshStatus();
    renderFiles(status);
    setInterval(refreshStatus, 1000);
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
