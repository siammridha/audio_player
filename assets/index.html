<title>Audio Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #121212;
    --panel: #1c1c1c;
    --text: #eeeeee;
    --muted: #888888;
    --orange: #ff8c1a;
    --orange-dim: #7a4a12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 28rem; }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--orange);
    margin: 0 0 1.25rem;
  }
  svg { flex-shrink: 0; }
  #now-playing {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 0.5rem;
    min-height: 1.2em;
  }
  #now-playing strong { color: var(--text); font-weight: 500; }
  #progress {
    display: none;
    align-items: center;
    gap: 0.6rem;
    margin: 0 0 1.5rem;
  }
  #progress-bar {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #2a2a2a;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: var(--orange);
    border-radius: 2px;
  }
  #time {
    color: var(--muted);
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  ul#files {
    list-style: none;
    margin: 0 0 1.5rem;
    padding: 0;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    overflow: hidden;
  }
  #files li + li { border-top: 1px solid #2a2a2a; }
  #files button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-align: left;
    background: var(--panel);
    color: var(--text);
    border: none;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #files button:hover { background: #262626; }
  #files button:active { background: #2e2e2e; }
  #files button.active { color: var(--orange); font-weight: 600; }
  #files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files .dur {
    margin-left: auto;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  #empty {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 0.75rem 1rem;
  }
  .controls { display: flex; gap: 0.75rem; }
  .controls button {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.85rem 0.35rem;
    font-size: 0.85rem;
    white-space: nowrap;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .controls button:hover:not(:disabled) { background: #262626; border-color: #3a3a3a; }
  .controls button:active:not(:disabled) { transform: scale(0.96); }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  #play-pause {
    background: var(--orange);
    color: #1a1200;
    font-weight: 700;
    font-size: 1rem;
    border-color: var(--orange);
    flex: 2;
  }
  #play-pause:hover:not(:disabled) { background: #ffa040; border-color: #ffa040; }
  #play-pause:disabled { background: var(--orange-dim); color: #1a1a1a; }
  #loop:hover:not(:disabled) { border-color: var(--orange); }
  #loop.on {
    color: var(--orange);
    border-color: var(--orange);
  }
</style>

<main>
  <h1>Audio Player</h1>
  <p id="now-playing">Nothing selected</p>
  <div id="progress">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <span id="time">0:00</span>
  </div>

  <ul id="files"></ul>

  <div class="controls">
    <button id="play-pause" disabled></button>
    <button id="restart" disabled></button>
    <button id="loop" disabled></button>
  </div>
</main>

<script>
  const ICONS = {
    play: '<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 5v14l12-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
    restart: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
    loop: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
    note: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  };

  const filesEl = document.getElementById("files");
  const nowPlayingEl = document.getElementById("now-playing");
  const progressEl = document.getElementById("progress");
  const progressFillEl = document.getElementById("progress-fill");
  const timeEl = document.getElementById("time");
  const playPauseEl = document.getElementById("play-pause");
  const restartEl = document.getElementById("restart");
  const loopEl = document.getElementById("loop");

  restartEl.innerHTML = ICONS.restart + "<span>Start Over</span>";
  loopEl.innerHTML = ICONS.loop + "<span>Loop</span>";

  let files = [];

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function formatTime(seconds) {
    if (seconds == null || !isFinite(seconds) || seconds < 0) return "0:00";
    const total = Math.floor(seconds);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const ss = String(s).padStart(2, "0");
    return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
  }

  async function api(path, options) {
    const res = await fetch(path, options);
    return res.json();
  }

  function renderFiles(status) {
    filesEl.innerHTML = "";
    if (files.length === 0) {
      const li = document.createElement("li");
      li.id = "empty";
      li.textContent = "No audio files found.";
      filesEl.appendChild(li);
      return;
    }
    for (const f of files) {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.dataset.name = f.name;
      button.innerHTML =
        ICONS.note +
        `<span class="name">${escapeHtml(f.name)}</span>` +
        (f.duration != null ? `<span class="dur">${formatTime(f.duration)}</span>` : "");
      if (f.name === status.file) button.classList.add("active");
      button.addEventListener("click", () => play(f.name));
      li.appendChild(button);
      filesEl.appendChild(li);
    }
  }

  function renderStatus(status) {
    nowPlayingEl.innerHTML = status.file
      ? `${ICONS.note}<span>Playing: <strong>${escapeHtml(status.file)}</strong></span>`
      : "Nothing selected";

    progressEl.style.display = status.file ? "flex" : "none";
    if (status.file) {
      timeEl.textContent =
        status.duration != null
          ? `${formatTime(status.position)} / ${formatTime(status.duration)}`
          : formatTime(status.position);
      const pct = status.duration ? Math.min(100, (status.position / status.duration) * 100) : 0;
      progressFillEl.style.width = `${pct}%`;
    }

    playPauseEl.disabled = !status.file;
    restartEl.disabled = !status.file;
    loopEl.disabled = false;

    playPauseEl.innerHTML =
      (status.playing ? ICONS.pause : ICONS.play) +
      `<span>${status.playing ? "Pause" : "Play"}</span>`;
    loopEl.classList.toggle("on", status.loop);

    for (const button of filesEl.querySelectorAll("button")) {
      button.classList.toggle("active", button.dataset.name === status.file);
    }
  }

  async function refreshStatus() {
    const status = await api("/api/status");
    renderStatus(status);
    return status;
  }

  async function play(name) {
    const status = await api("/api/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file: name }),
    });
    renderStatus(status);
  }

  playPauseEl.addEventListener("click", async () => {
    renderStatus(await api("/api/toggle", { method: "POST" }));
  });

  restartEl.addEventListener("click", async () => {
    renderStatus(await api("/api/restart", { method: "POST" }));
  });

  loopEl.addEventListener("click", async () => {
    const wantsLoop = !loopEl.classList.contains("on");
    renderStatus(
      await api("/api/loop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ loop: wantsLoop }),
      })
    );
  });

  (async function init() {
    files = await api("/api/files");
    const status = await refreshStatus();
    renderFiles(status);
    setInterval(refreshStatus, 1000);
  })();
</script>
